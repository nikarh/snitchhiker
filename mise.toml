# Development tools and tasks. Rust itself comes from rust-toolchain.toml.
#
# Nothing here that needs privileges runs on the machine it is started on: the daemon, BPF, nftables, packages and
# containers are only ever run in the disposable VMs of e2e/ (see AGENTS.md).
[tools]
git-cliff = "2.14.2"
cargo-deny = "0.20.2"
nfpm = "2.49.0"

[tasks.fmt]
description = "Format the Rust code"
run = "cargo fmt --all"

[tasks.lint]
description = "rustfmt check and clippy"
run = ["cargo fmt --all --check", "cargo clippy --locked --all-targets"]

[tasks.test]
description = "Run the host-safe tests (unit, property): nothing privileged"
run = "cargo test --locked"

[tasks.deny]
description = "Audit dependencies: advisories, licenses, duplicates, sources"
run = "cargo deny check"

[tasks.ci]
description = "What CI's check job runs: lint, tests, and that action pins are up to date"
depends = ["lint", "test"]
run = ["scripts/check-actions.sh"]

[tasks.check]
description = "Everything CI checks on the host"
depends = ["ci", "deny"]

[tasks.build]
description = "Release build of the binaries"
run = "cargo build --locked --release"

[tasks.package]
description = "Build the .deb and Arch packages of a release build into out/"
depends = ["build"]
run = "scripts/package.sh x86_64 target/release/snitchhikerd out"

[tasks.changelog]
description = "Regenerate CHANGELOG.md from the commits"
run = "git cliff --offline -o CHANGELOG.md"

[tasks.actionlint]
description = "Lint the GitHub workflows"
run = "mise x aqua:rhysd/actionlint@latest shellcheck@latest -- actionlint"

[tasks."vm:up"]
description = "Boot the node test VM (e2e/vm.sh; SNITCHHIKER_VM_DISTRO=arch|debian)"
run = "e2e/vm.sh node up"

[tasks."vm:ssh"]
description = "A shell (or a command) in the node test VM"
run = "e2e/vm.sh node ssh"

[tasks."vm:down"]
description = "Stop the node test VM and throw its disk away"
run = "e2e/vm.sh node down"

[tasks.e2e]
description = "Build, then run the end-to-end scenarios in the node test VM (e2e/run.sh [filter]; KEEP_VM=1 keeps it)"
run = "e2e/run.sh"
