# Development tools and tasks. Rust itself comes from rust-toolchain.toml.
#
# Nothing here that needs privileges runs on the machine it is started on: the daemon, BPF, nftables, packages and
# containers are only ever run in the disposable VMs of e2e/ (see AGENTS.md).
[tools]
"aqua:bufbuild/buf" = "1.75.0"
node = "26.13.1"
git-cliff = "2.14.2"
cargo-deny = "0.20.2"
nfpm = "2.49.0"
# The Android app (android/): the JDK, Gradle, the SDK's command-line tools and cargo-ndk for the Rust core.
java = "temurin-21.0.12+8.0.LTS"
gradle = "9.8.1"
"http:android-cmdline-tools" = { version = "16111833", url = "https://dl.google.com/android/repository/commandlinetools-linux-{{version}}_latest.zip", bin_path = "cmdline-tools/bin" }
"cargo:cargo-ndk" = "4.1.2"

[env]
ANDROID_HOME = "{{config_root}}/.android-sdk"
ANDROID_SDK_ROOT = "{{config_root}}/.android-sdk"
# The NDK `mise run android:sdk` installs, for cargo-ndk.
ANDROID_NDK_HOME = "{{config_root}}/.android-sdk/ndk/30.0.16248370"

[tasks."android:sdk"]
description = "Install the pinned Android SDK packages and the NDK into .android-sdk"
run = """
yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null
sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-37.2" "build-tools;37.0.0" "platform-tools" "ndk;30.0.16248370"
"""

[tasks."android:emulator-sdk"]
description = "Install the Android emulator and a system image without Google services (for scripts/android-emulator.sh)"
run = 'yes | sdkmanager --sdk_root="$ANDROID_HOME" "emulator" "system-images;android-35;default;x86_64"'

[tasks."android:core"]
description = "The Rust core of the Android app, for the emulator and phones (cargo-ndk), into android/app/src/main/jniLibs"
run = """
rustup target add aarch64-linux-android x86_64-linux-android >/dev/null
cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --locked --release -p snitchhiker-mobile
# cargo-ndk copies every library the build made: only the core is loaded.
find android/app/src/main/jniLibs -name 'lib*.so' ! -name libsnitchhiker_mobile.so -delete
"""

[tasks."android:check"]
description = "The Android app's checks: ktlint (spotless), Android Lint, the JVM tests, and a debug build"
depends = ["android:core"]
dir = "android"
run = "./gradlew spotlessCheck :core:test :app:lintFossDebug :app:lintPlayDebug :app:assembleFossDebug :app:assemblePlayDebug"

[tasks."android:build"]
description = "The Android app's release APK (signed with ANDROID_KEYSTORE when set, the debug key otherwise)"
depends = ["android:core"]
dir = "android"
run = "./gradlew :app:assembleFossRelease :app:assemblePlayRelease"

[tasks."e2e:android"]
description = "The Android app end to end: an emulator, the node VM and a relay between them (e2e/android.sh)"
run = "e2e/android.sh"

[tasks.fmt]
description = "Format the Rust code"
run = "cargo fmt --all"

[tasks.lint]
description = "rustfmt check and clippy"
run = ["cargo fmt --all --check", "cargo clippy --locked --all-targets"]

[tasks.test]
description = "Run the host-safe tests (unit, property): nothing privileged"
run = "cargo test --locked"

[tasks.perf]
description = "The performance budgets (plan §11.1), in release: deciding, ingestion and every kind of query on a million events; fails when one is over"
run = [
  "cargo test --locked --release -p snitchhiker-daemon -- --ignored --nocapture",
  "cargo bench --locked -p snitchhiker-daemon --bench budgets",
]

[tasks."perf:full"]
description = "The budgets on ten million events (about 1.5 GB in TMPDIR, a few minutes)"
env = { SNITCHHIKER_BENCH_EVENTS = "10000000" }
run = "cargo bench --locked -p snitchhiker-daemon --bench budgets"

[tasks.deny]
description = "Audit dependencies: advisories, licenses, duplicates, sources"
run = "cargo deny check"

[tasks."proto:check"]
description = "Lint the protocol schema and check it against PROTO_BASE (default origin/main) for breaking changes"
dir = "proto"
run = 'buf lint && buf breaking --against "../.git#ref=${PROTO_BASE:-origin/main},subdir=proto"'

[tasks.ci]
description = "What CI's check job runs: lint, tests, the protocol check, and that action pins are up to date"
depends = ["lint", "test", "proto:check"]
run = ["scripts/check-actions.sh"]

[tasks.check]
description = "Everything CI checks on the host"
depends = ["ci", "deny"]

[tasks.build]
description = "Release build of the binaries"
run = "cargo build --locked --release"

[tasks.package]
description = "Build the .deb and Arch packages of a release build into out/"
depends = ["build"]
run = "scripts/package.sh x86_64 target/release/snitchhikerd out"

[tasks.changelog]
description = "Regenerate CHANGELOG.md from the commits"
run = "git cliff --offline -o CHANGELOG.md"

[tasks.docs]
description = "Serve the docs site locally with live reload, at http://localhost:4321"
dir = "site"
run = ["npm install --no-audit --no-fund", "npm run dev"]

[tasks."docs:api"]
description = "The crates' API docs (rustdoc), into site/public/api, published with the site"
run = [
  "cargo doc --locked --no-deps --workspace --exclude snitchhiker-e2e --exclude snitchhiker-ui --exclude snitchhiker-wire-bench",
  "rm -rf site/public/api",
  "cp -r target/doc site/public/api",
]

[tasks."docs:build"]
description = "Build the docs site as CI does, into site/dist, and check its links"
depends = ["docs:api"]
dir = "site"
env = { DOCS_VERSION = "main" }
run = ["npm install --no-audit --no-fund", "npm run build"]

[tasks.actionlint]
description = "Lint the GitHub workflows"
run = "mise x aqua:rhysd/actionlint@latest shellcheck@latest -- actionlint"

[tasks."vm:up"]
description = "Boot the node test VM (e2e/vm.sh; SNITCHHIKER_VM_DISTRO=arch|debian)"
run = "e2e/vm.sh node up"

[tasks."vm:ssh"]
description = "A shell (or a command) in the node test VM"
run = "e2e/vm.sh node ssh"

[tasks."vm:down"]
description = "Stop the node test VM and throw its disk away"
run = "e2e/vm.sh node down"

[tasks.e2e]
description = "Build, then run the end-to-end scenarios in the node test VM (e2e/run.sh [filter]; KEEP_VM=1 keeps it)"
run = "e2e/run.sh"
