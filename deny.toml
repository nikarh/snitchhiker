[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licenses only: Snitchhiker is MIT OR Apache-2.0, and no GPL code may be linked into what it ships
# (docs/plan.md, "Licensing"). Add a license here only when a dependency needs it.
# Zlib: foldhash, through hashbrown (aya).
# Permissive licenses only. BSD-2-Clause and BSD-3-Clause: zstd (the library and its bindings), for compressing bulk
# data on remote connections.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "BSD-2-Clause", "BSD-3-Clause"]

[bans]
multiple-versions = "deny"
skip = [
  { crate = "syn@2.0.119", reason = "tracing-attributes and thiserror-impl still use syn 2" },
  { crate = "hashbrown@0.15.5", reason = "petgraph (prost-build, build time only) is on hashbrown 0.15" },
  { crate = "foldhash@0.1.5", reason = "hashbrown 0.15, through petgraph (prost-build, build time only)" },
]
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
