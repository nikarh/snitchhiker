// Snitchhiker's client protocol, version 1: what the desktop app, the command line, the MCP server and (over iroh)
// the Android app speak to a node.
//
// Framing: every frame is a little-endian uint32 length, then that many bytes of a ClientFrame (client to node) or a
// ServerFrame (node to client). A frame is at most 16 MiB.
//
// A local connection (the unix sockets in /run/snitchhiker) starts with a 6-byte preamble from the client: "SNHK"
// and the major version as a little-endian uint16 (1). A node that doesn't speak that major answers with a Refusal
// and closes. Then the client sends Hello, and the node answers Welcome (or Refusal).
//
// Within major version 1 changes are additive only: fields and messages are added, never renumbered, renamed or
// removed (removed fields become reserved). Unknown fields are ignored; every enum's 0 is UNSPECIFIED.

syntax = "proto3";

package snitchhiker.v1;

// ---------------------------------------------------------------------------------------------------------------------
// Frames

message ClientFrame {
  oneof body {
    Hello hello = 1;
    Request request = 2;
  }
}

message ServerFrame {
  oneof body {
    Welcome welcome = 1;
    Response response = 2;
    Notice notice = 3;
    // The connection is refused (version, authentication); the node closes it after this frame.
    Refusal refusal = 4;
  }
}

message Hello {
  // The client's minor version of the major the preamble named.
  uint32 minor = 1;
  // What the client is ("desktop", "cli", "mcp", "android") and its version, for logs and the device list.
  string app = 2;
  string app_version = 3;
  repeated string capabilities = 4;
}

message Welcome {
  uint32 minor = 1;
  string daemon_version = 2;
  string node_name = 3;
  // Changes when the node's database is recreated: clients drop what they cached of it.
  uint64 node_epoch = 4;
  repeated string capabilities = 5;
  // What this connection may do.
  Role role = 6;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  // Read only.
  ROLE_VIEWER = 1;
  // Read, answer prompts, change rules.
  ROLE_ADMIN = 2;
  // The admin socket (root): everything.
  ROLE_ROOT = 3;
  // An agent (MCP): propose only.
  ROLE_AGENT = 4;
}

message Refusal {
  string reason = 1;
}

// ---------------------------------------------------------------------------------------------------------------------
// Requests and responses: a client may have many requests in flight; each response carries its request's id.

message Request {
  uint64 id = 1;
  oneof method {
    GetStatus get_status = 10;
    ListRules list_rules = 11;
    AddRule add_rule = 12;
    DeleteRule delete_rule = 13;
    SetRuleEnabled set_rule_enabled = 14;
    ListEvents list_events = 15;
    Subscribe subscribe = 16;
    Unsubscribe unsubscribe = 17;
    ListPrompts list_prompts = 18;
    AnswerPrompt answer_prompt = 19;
    Learn learn = 20;
    ImportRules import_rules = 21;
    ExportRules export_rules = 22;
    ListAudit list_audit = 23;
    UpdateRule update_rule = 24;
    AddFolder add_folder = 25;
    UpdateFolder update_folder = 26;
    DeleteFolder delete_folder = 27;
    ListChanges list_changes = 28;
    Undo undo = 29;
    Explore explore = 30;
    ListConnections list_connections = 31;
    KillConnection kill_connection = 32;
    Explain explain = 33;
    LintRules lint_rules = 34;
    EditRules edit_rules = 35;
    GetPolicy get_policy = 36;
    SetPolicy set_policy = 37;
    ListTrustedClients list_trusted_clients = 38;
    GetSystemFirewall get_system_firewall = 39;
    SetSystemFirewall set_system_firewall = 40;
    ConfirmSystemFirewall confirm_system_firewall = 41;
  }
}

message Response {
  uint64 id = 1;
  oneof result {
    Error error = 2;
    Done done = 3;
    Status status = 10;
    RuleList rules = 11;
    RuleAdded rule_added = 12;
    EventPage events = 15;
    Subscribed subscribed = 16;
    PromptList prompts = 18;
    RuleFile rule_file = 20;
    AuditPage audit = 23;
    EventBlock event_block = 24;
    FolderAdded folder_added = 25;
    ChangePage changes = 26;
    ExplorePage explored = 27;
    ConnectionList connections = 28;
    Explanation explanation = 29;
    LintReport lint_report = 30;
    NodePolicy policy = 31;
    TrustedClients trusted_clients = 32;
    SystemFirewall system_firewall = 33;
  }
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // The request is malformed or its values are invalid.
  ERROR_CODE_INVALID = 1;
  ERROR_CODE_NOT_FOUND = 2;
  // The connection's role doesn't allow it.
  ERROR_CODE_FORBIDDEN = 3;
  // A default or managed rule: changed in its file, not here.
  ERROR_CODE_LOCKED = 4;
  ERROR_CODE_INTERNAL = 5;
  // The node doesn't know the method (an older node).
  ERROR_CODE_UNSUPPORTED = 6;
  // A dangerous action that needs step-up authorization (polkit) the client's user didn't give.
  ERROR_CODE_NOT_AUTHORIZED = 7;
}

// Success without a result.
message Done {}

// ---------------------------------------------------------------------------------------------------------------------
// Status

message GetStatus {}

message Status {
  string daemon_version = 1;
  Mode mode = 2;
  // What happens to a connection no rule decides.
  Policy no_match = 3;
  bool fail_open = 4;
  // Connections decided since the daemon started.
  uint64 decided = 5;
  // Events the history couldn't keep up with.
  uint64 dropped_events = 6;
  uint32 rules = 7;
  uint32 pending_prompts = 8;
  uint32 clients = 9;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_ENFORCE = 1;
  MODE_MONITOR = 2;
}

enum Policy {
  POLICY_UNSPECIFIED = 0;
  POLICY_ALLOW = 1;
  POLICY_DENY = 2;
  POLICY_REJECT = 3;
  // Ask a connected client; the prompt's timeout decides when nobody answers.
  POLICY_ASK = 4;
}

// ---------------------------------------------------------------------------------------------------------------------
// Rules, in the shape of rule files (see the `spec` module of snitchhiker-core).

enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_ALLOW = 1;
  ACTION_DENY = 2;
  ACTION_REJECT = 3;
}

enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_FALLBACK = 1;
  TIER_NORMAL = 2;
  TIER_OVERRIDE = 3;
}

enum Context {
  CONTEXT_UNSPECIFIED = 0;
  CONTEXT_HOST = 1;
  CONTEXT_CONTAINER = 2;
  CONTEXT_VM = 3;
  CONTEXT_NETNS = 4;
  CONTEXT_ANY = 5;
}

// All present conditions must hold; a list means any of its items. Patterns are exact unless prefixed with glob: or
// re:. Ports are numbers or low-high ranges; protocols tcp, udp, icmp, icmpv6 or numbers.
message Conditions {
  repeated string exe = 1;
  repeated string app = 2;
  repeated string cmdline = 3;
  repeated string parent = 4;
  repeated uint32 uid = 5;
  repeated string host = 6;
  repeated string net = 7;
  repeated string port = 8;
  repeated string protocol = 9;
  // Unspecified: the host only.
  Context context = 10;
}

message Rule {
  uint64 id = 1;
  optional uint64 folder = 2;
  string name = 3;
  bool enabled = 4;
  Action action = 5;
  Tier tier = 6;
  string notes = 7;
  Conditions conditions = 8;
  // A default or managed rule: shown, not changeable.
  bool locked = 9;
  // When it stops applying (Unix milliseconds); none: never.
  optional uint64 expires_ms = 10;
  // It applies until the daemon restarts.
  bool until_restart = 11;
}

message Folder {
  uint64 id = 1;
  optional uint64 parent = 2;
  string name = 3;
  bool enabled = 4;
  Conditions scope = 5;
  bool locked = 6;
}

message ListRules {}

message RuleList {
  repeated Folder folders = 1;
  repeated Rule rules = 2;
}

message AddRule {
  // Its id and locked are ignored.
  Rule rule = 1;
}

message RuleAdded {
  uint64 id = 1;
}

message DeleteRule {
  uint64 id = 1;
}

// Replaces a stored rule (by its id) with this one; locked rules can't be.
message UpdateRule {
  Rule rule = 1;
}

// Its id and locked are ignored.
message AddFolder {
  Folder folder = 1;
}

message FolderAdded {
  uint64 id = 1;
}

// Replaces a folder (by its id): its name, parent, enabled and scope.
message UpdateFolder {
  Folder folder = 1;
}

// Deletes a folder with the folders below it and all their rules. More than 20 rules is a dangerous action.
message DeleteFolder {
  uint64 id = 1;
}

// The history of the rules and folders: every change, newest first, `limit` with ids below `before` (0: from the
// newest).
message ListChanges {
  uint64 before = 1;
  uint32 limit = 2;
}

message Change {
  uint64 id = 1;
  // The changes of one request share a batch, and are undone together.
  uint64 batch = 2;
  uint64 time_ms = 3;
  // Who made it ("desktop", "cli", a device's name).
  string app = 4;
  // What changed, for people.
  string what = 5;
}

message ChangePage {
  repeated Change changes = 1;
}

// Undoes the batch of a change, as a new batch. Refused if something it changed was changed again since.
message Undo {
  uint64 change = 1;
}

message SetRuleEnabled {
  uint64 id = 1;
  bool enabled = 2;
}

// A rule file (TOML), for learn, import and export.
message RuleFile {
  string toml = 1;
}

message Learn {
  // Connections no rule decided in the last this many hours.
  uint32 hours = 1;
  string folder = 2;
}

message ImportRules {
  string toml = 1;
  // The folder's name when the file has none.
  string folder = 2;
}

message ExportRules {}

// ---------------------------------------------------------------------------------------------------------------------
// The connection history

enum Source {
  SOURCE_UNSPECIFIED = 0;
  // A rule decided.
  SOURCE_RULE = 1;
  // No rule matched; the policy decided.
  SOURCE_POLICY = 2;
  // Monitor mode: it passed, whatever was decided.
  SOURCE_MONITOR = 3;
  // A client answered a prompt.
  SOURCE_PROMPT = 4;
  // Nobody answered a prompt in time.
  SOURCE_TIMEOUT = 5;
}

message ConnectionEvent {
  int64 seq = 1;
  uint64 time_ms = 2;
  string exe = 3;
  // The destination's name, when known.
  string host = 4;
  uint32 uid = 5;
  uint32 pid = 6;
  uint32 protocol = 7;
  // 4 bytes (IPv4) or 16 (IPv6).
  bytes address = 8;
  uint32 port = 9;
  Context context = 10;
  Action action = 11;
  Source source = 12;
  optional uint64 rule = 13;
  uint64 bytes_out = 14;
  uint64 bytes_in = 15;
}

message ListEvents {
  // Events older than this sequence number; 0 for the newest.
  int64 before = 1;
  uint32 limit = 2;
  // Answer with an EventBlock instead of an EventPage.
  bool columnar = 3;
  // Only the events this query matches (the query language: see the documentation). A filtered page examines a bounded
  // range of history, so it can hold fewer than `limit` events, or none, while older ones match: the next page starts
  // at its `scanned_from`.
  string query = 4;
}

// Bulk data: events as a columnar block (its format is in the protocol documentation), and the strings it refers to
// that this connection hasn't been sent yet. Strings are the node's interned ids: stable for the node's epoch, so a
// client keeps one dictionary per node.
message EventBlock {
  bytes columns = 1;
  Dictionary dictionary = 2;
  // For a page of history: the oldest sequence number it covers; the next page asks for events before it. 0: there is
  // nothing older. Unset in subscriptions.
  int64 scanned_from = 3;
}

message Dictionary {
  repeated uint32 ids = 1;
  // values[i] is the string of ids[i].
  repeated string values = 2;
}

message EventPage {
  repeated ConnectionEvent events = 1;
  // As EventBlock's.
  int64 scanned_from = 2;
}

// ---------------------------------------------------------------------------------------------------------------------
// Subscriptions: the node pushes a Notice for each thing that happens, until Unsubscribe or the connection closes.
//
// Subscribing to prompts first sends a Prompt for each one waiting. Subscribing to events with `after` first sends the
// stored events after that sequence number, oldest first, then the live ones: a client that reconnects resumes from
// the last event it saw and misses nothing. An event or prompt may arrive twice around that moment: clients ignore
// events whose seq they have seen and prompts whose id they know.

enum Topic {
  TOPIC_UNSPECIFIED = 0;
  // Prompts as they open and as they are resolved (by anyone, or by timing out).
  TOPIC_PROMPTS = 1;
  // Every connection as it is decided.
  TOPIC_EVENTS = 2;
  // A rule or folder changed: list them again.
  TOPIC_RULES = 3;
}

message Subscribe {
  Topic topic = 1;
  // TOPIC_EVENTS: send the stored events with a greater seq first. At most 4000 can be sent this way; further behind,
  // the answer is ERROR_CODE_INVALID, and the client pages with ListEvents and subscribes from the newest.
  optional int64 after = 2;
  // TOPIC_EVENTS: events come as EventBlock notices, one per batch the node records (about every 100 ms), instead of
  // one ConnectionEvent each. A backfill comes as one block.
  bool columnar = 3;
}

message Subscribed {
  uint64 subscription = 1;
}

message Unsubscribe {
  uint64 subscription = 1;
}

message Notice {
  uint64 subscription = 1;
  oneof body {
    Prompt prompt = 2;
    PromptResolved prompt_resolved = 3;
    ConnectionEvent event = 4;
    RulesChanged rules_changed = 5;
    EventBlock event_block = 7;
  }
  // Notices of this subscription were dropped before this one, because the client didn't read them fast enough: it
  // resubscribes from the last event it saw, or lists prompts or rules again.
  bool missed = 6;
}

message RulesChanged {}

// ---------------------------------------------------------------------------------------------------------------------
// Prompts

// A connection waiting for a decision. Connections of the same program to the same destination join one prompt.
message Prompt {
  uint64 id = 1;
  uint64 created_ms = 2;
  // When it times out, and the policy decides.
  uint64 expires_ms = 3;
  string exe = 4;
  string cmdline = 5;
  uint32 uid = 6;
  string user = 7;
  uint32 pid = 8;
  repeated string hosts = 9;
  bytes address = 10;
  uint32 port = 11;
  uint32 protocol = 12;
  Context context = 13;
  // How many connections wait on it.
  uint32 waiting = 14;
  // Rules that would decide it, narrowest first: the first is the default answer.
  repeated Suggestion suggestions = 15;
  // The executable is writable by a user other than root: any process of that user could replace it.
  bool exe_writable = 16;
}

message Suggestion {
  string label = 1;
  Conditions conditions = 2;
  // It allows more than this destination (a whole domain, any port, anywhere).
  bool broad = 3;
}

message PromptResolved {
  uint64 id = 1;
  Action action = 2;
  // Who answered ("desktop", a device's name), or empty when it timed out.
  string by = 3;
  // The rule the answer created, if any.
  optional uint64 rule = 4;
  bool timed_out = 5;
}

message ListPrompts {}

message PromptList {
  repeated Prompt prompts = 1;
}

enum Duration {
  DURATION_UNSPECIFIED = 0;
  // Only the waiting connections; no rule.
  DURATION_ONCE = 1;
  DURATION_UNTIL_RESTART = 2;
  DURATION_HOUR = 3;
  DURATION_HALF_DAY = 4;
  DURATION_FOREVER = 5;
}

message AnswerPrompt {
  uint64 id = 1;
  Action action = 2;
  Duration duration = 3;
  // Which suggestion the rule is made from.
  uint32 suggestion = 4;
  // Or conditions of the client's own (instead of a suggestion).
  optional Conditions conditions = 5;
  // The folder the rule goes in. Without one, a rule naming a program goes in the program's folder (`Apps/<program>`,
  // scoped to it, made if needed), and others at the top level.
  optional uint64 folder = 6;
}

// ---------------------------------------------------------------------------------------------------------------------
// The audit trail: every dangerous action attempted (an allow-everything rule, and later policy changes, pairing),
// with who asked and what came of it.

enum AuditOutcome {
  AUDIT_OUTCOME_UNSPECIFIED = 0;
  // Step-up authorization was given.
  AUDIT_OUTCOME_AUTHORIZED = 1;
  // Step-up authorization was refused, or couldn't be asked for.
  AUDIT_OUTCOME_REFUSED = 2;
  // Done without step-up: by root, or with step-up switched off.
  AUDIT_OUTCOME_UNCHECKED = 3;
}

message AuditEntry {
  uint64 id = 1;
  uint64 time_ms = 2;
  // The client ("desktop", "cli", a device's name).
  string app = 3;
  uint32 uid = 4;
  uint32 pid = 5;
  // What was asked, for people.
  string action = 6;
  AuditOutcome outcome = 7;
}

message ListAudit {
  // Entries older than this id; 0 for the newest.
  uint64 before = 1;
  uint32 limit = 2;
}

message AuditPage {
  repeated AuditEntry entries = 1;
}

// ---------------------------------------------------------------------------------------------------------------------
// The Explorer: the history grouped by one dimension over a time range, from hourly rollups, so it answers as fast
// for a million events as for a hundred.

enum Dimension {
  DIMENSION_UNSPECIFIED = 0;
  DIMENSION_PROGRAM = 1;
  DIMENSION_HOST = 2;
  DIMENSION_PORT = 3;
  DIMENSION_USER = 4;
}

message ExploreFilter {
  Dimension dimension = 1;
  // A program's path, a host name (empty: connections without one), a port or a user id.
  string value = 2;
}

message Explore {
  // The hours touched by [from_ms, to_ms) are counted whole.
  uint64 from_ms = 1;
  uint64 to_ms = 2;
  Dimension group_by = 3;
  // Only the connections with this value of another dimension (a drill-down).
  optional ExploreFilter filter = 4;
  // At most this many groups, busiest first.
  uint32 limit = 5;
}

message ExploreRow {
  // The group: a program's path, a host name (empty: no name), a port or a user id.
  string key = 1;
  uint64 allowed = 2;
  // Denied or rejected.
  uint64 blocked = 3;
  uint64 bytes_out = 4;
  uint64 bytes_in = 5;
}

message ExplorePage {
  repeated ExploreRow rows = 1;
}

// ---------------------------------------------------------------------------------------------------------------------
// Connections: the machine's live TCP connections and connected UDP sockets, with their programs.

message ListConnections {}

message LiveConnection {
  uint32 protocol = 1;
  // 4 bytes (IPv4) or 16 (IPv6).
  bytes local = 2;
  uint32 local_port = 3;
  bytes remote = 4;
  uint32 remote_port = 5;
  // "established", "opening", "closing", "connected" (UDP), ...
  string state = 6;
  uint32 uid = 7;
  // 0, and exe empty, for sockets whose opening the node didn't see: inbound ones (accepted), and ones older than
  // the daemon.
  uint32 pid = 8;
  string exe = 9;
  // The name the program looked up for the remote address, if any.
  string host = 10;
  uint64 bytes_out = 11;
  uint64 bytes_in = 12;
  Context context = 13;
}

message ConnectionList {
  repeated LiveConnection connections = 1;
}

// Closes a live socket, as a reject does: its program's next call fails.
message KillConnection {
  uint32 protocol = 1;
  bytes local = 2;
  uint32 local_port = 3;
  bytes remote = 4;
  uint32 remote_port = 5;
}

// ---------------------------------------------------------------------------------------------------------------------
// The node's policy: the settings of daemon.toml that clients may change while the daemon runs. What a client changed
// takes precedence over the file until it is reset, and is recorded in the history (and undone) like rule changes.

message GetPolicy {}

message NodePolicy {
  Mode mode = 1;
  // What happens to a connection no rule decides.
  Policy no_match = 2;
  // With no_match ask: what happens when no client is listening for prompts.
  Action no_client = 3;
  // With no_match ask: how long a prompt waits for an answer, and what happens then.
  uint32 prompt_timeout_secs = 4;
  Action on_timeout = 5;
  // How long connection history is kept.
  uint32 retention_days = 6;
  // The settings clients changed (mode, no_match, no_client, prompt_timeout_secs, on_timeout, retention_days).
  repeated string changed = 7;
}

// Sets the settings given and returns the ones named in `reset` to daemon.toml's; answers with the new policy. A change
// that lets blocked connections through (monitor mode, no_match allow, no_client or on_timeout allow) is a dangerous
// action.
message SetPolicy {
  optional Mode mode = 1;
  optional Policy no_match = 2;
  optional Action no_client = 3;
  // 5 to 3600.
  optional uint32 prompt_timeout_secs = 4;
  optional Action on_timeout = 5;
  // 1 to 3650.
  optional uint32 retention_days = 6;
  repeated string reset = 7;
}

// ---------------------------------------------------------------------------------------------------------------------
// The system firewall: the base packet filter beside the application rules (table `inet snitchhiker_system`), a form
// over a fixed set of statements. Changes are recorded in the history and undone like rule changes.

enum ChainPolicy {
  CHAIN_POLICY_UNSPECIFIED = 0;
  CHAIN_POLICY_ACCEPT = 1;
  CHAIN_POLICY_DROP = 2;
}

enum SystemChain {
  SYSTEM_CHAIN_UNSPECIFIED = 0;
  SYSTEM_CHAIN_INPUT = 1;
  SYSTEM_CHAIN_FORWARD = 2;
  SYSTEM_CHAIN_OUTPUT = 3;
}

enum SystemTarget {
  SYSTEM_TARGET_UNSPECIFIED = 0;
  SYSTEM_TARGET_ACCEPT = 1;
  SYSTEM_TARGET_DROP = 2;
  // ICMP port unreachable (TCP: a reset).
  SYSTEM_TARGET_REJECT = 3;
  // To the kernel log, then on to the next rule.
  SYSTEM_TARGET_LOG = 4;
  // Decided by the daemon as an application connection (forward chain only).
  SYSTEM_TARGET_QUEUE = 5;
}

message SystemRule {
  bool enabled = 1;
  string description = 2;
  SystemChain chain = 3;
  // tcp, udp, icmp, icmpv6, a number, or empty for any.
  string protocol = 4;
  // Addresses or networks (CIDR); empty for any. Each source is paired with each destination of its family.
  repeated string source = 5;
  repeated string destination = 6;
  // A port or a range (`8000-8999`); empty for any. TCP and UDP only.
  string source_ports = 7;
  string destination_ports = 8;
  // An interface name, or a prefix ending in `*`; empty for any.
  string in_interface = 9;
  string out_interface = 10;
  // new, established, related, invalid: any of them.
  repeated string ct_state = 11;
  // echo-request, echo-reply, destination-unreachable, time-exceeded. ICMP and ICMPv6 only.
  repeated string icmp_types = 12;
  SystemTarget target = 13;
}

message SystemFirewall {
  bool enabled = 1;
  ChainPolicy input = 2;
  ChainPolicy forward = 3;
  repeated SystemRule rules = 4;
  // A change waiting to be confirmed, reverted when this time (Unix ms) comes; 0: none.
  uint64 reverts_at_ms = 5;
}

message GetSystemFirewall {}

// Replaces the system firewall. With `revert_after_secs`, the change is undone then unless ConfirmSystemFirewall comes
// first: for a change made over the network that could cut the client off. Turning the firewall off, or the input
// policy from drop to accept, is a dangerous action.
message SetSystemFirewall {
  SystemFirewall firewall = 1;
  uint32 revert_after_secs = 2;
}

message ConfirmSystemFirewall {}

// The client binaries allowed on the client socket: those the packages registered (pinned to their digest), and those
// daemon.toml allows by path.
message ListTrustedClients {}

message TrustedClient {
  string path = 1;
  // Lowercase hex; empty for clients allowed by path alone.
  string sha256 = 2;
  // The file there now has that digest (or, by path alone, exists): it can connect.
  bool current = 3;
}

message TrustedClients {
  repeated TrustedClient clients = 1;
}

// ---------------------------------------------------------------------------------------------------------------------
// Rule maintenance: changes to many rules at once, and the lint and dedupe report.

// Changes the rules `ids` in one batch, which one undo reverts. Locked rules can't be changed. Deleting more than 20
// rules, or making an allow rule that allows every program to connect anywhere, is a dangerous action.
message EditRules {
  repeated uint64 ids = 1;
  oneof edit {
    bool enabled = 2;
    MoveRules move = 3;
    Action action = 4;
    // From now; not DURATION_ONCE.
    Duration expires = 5;
    bool delete = 6;
  }
}

message MoveRules {
  // None: the top level.
  optional uint64 folder = 1;
}

message LintRules {
  // Rules that decided no connection in this many days (and weren't changed in them) are reported; 0: not looked at.
  uint32 unused_days = 1;
}

enum LintKind {
  LINT_KIND_UNSPECIFIED = 0;
  // Matches exactly what `other` matches, with the same action.
  LINT_KIND_DUPLICATE = 1;
  // `other` matches everything it does, with the same action, at the same tier or above.
  LINT_KIND_REDUNDANT = 2;
  // An allow rule that the deny or reject rule `other` always beats.
  LINT_KIND_SHADOWED = 3;
  // Its time is up.
  LINT_KIND_EXPIRED = 4;
  LINT_KIND_NEVER_HIT = 5;
  // An allow rule on a binary that a user other than root can replace.
  LINT_KIND_WRITABLE_BINARY = 6;
  // Its binary is gone; `suggestion` covers the one that took its place, if one did.
  LINT_KIND_MISSING_BINARY = 7;
}

message LintFinding {
  LintKind kind = 1;
  uint64 rule = 2;
  optional uint64 other = 3;
  // A program pattern to replace the rule's with, as rule files write it (`glob:/opt/app/*/bin/app`).
  string suggestion = 4;
  // What is wrong, for people.
  string description = 5;
}

message LintReport {
  repeated LintFinding findings = 1;
}

// ---------------------------------------------------------------------------------------------------------------------
// Explain: why a recorded connection is decided as it is, by today's rules.

message Explain {
  // The event's seq.
  int64 seq = 1;
}

message ExplainedRule {
  uint64 id = 1;
  string name = 2;
  Action action = 3;
  Tier tier = 4;
  // Higher is narrower: among the rules of one tier and kind, the narrowest is reported.
  uint32 specificity = 5;
}

message Explanation {
  ConnectionEvent event = 1;
  // Every rule that matches it today, in precedence order: the first decides. Empty: no rule matches, and the policy
  // decides.
  repeated ExplainedRule rules = 2;
  // The history keeps no command lines and parent programs: rules with those conditions are checked as if they
  // didn't hold.
  bool partial = 3;
}
