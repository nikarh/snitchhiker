name: Publish

# Builds the binaries once per architecture, then signs and uploads them to the release. Runs when a release is
# published, and for the `latest` pre-release when the Latest workflow calls it. Run by hand, it publishes a release's
# tag again.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      version-suffix:
        description: Appended to the version from Cargo.toml, e.g. -dev+abc1234
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish, e.g. v0.2.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # Only releases are built when published: the Latest workflow creates the `latest` pre-release once and publishes
    # it itself.
    if: >-
      github.repository_owner == 'nikarh'
      && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu: the binaries need at least its glibc (2.35).
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # scripts/package.sh counts the commits of builds of main.
          fetch-depth: 0
      - name: Check the tag matches the version
        if: startsWith(env.TAG, 'v')
        run: test "$TAG" = "v$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
      # The eBPF programs are compiled with clang against the libbpf and kernel UAPI headers; the desktop app links
      # fontconfig and freetype, and its toolkit wants the Wayland and xkbcommon headers.
      - run: >-
          sudo apt-get install -y --no-install-recommends clang libbpf-dev linux-libc-dev
          libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.arch }}
      - name: Build
        env:
          SNITCHHIKER_VERSION_SUFFIX: ${{ inputs.version-suffix }}
        run: |
          set -euo pipefail
          cargo build --locked --release -p snitchhiker-daemon -p snitchhiker-ui -p snitchhiker-relay
          bin=target/release/snitchhikerd
          "$bin" --version
          mkdir -p out
          cp "$bin" "out/snitchhikerd-${{ matrix.arch }}-linux-gnu"
          cp target/release/snitchhiker-ui "out/snitchhiker-ui-${{ matrix.arch }}-linux-gnu"
          cp target/release/snitchhiker-relay "out/snitchhiker-relay-${{ matrix.arch }}-linux-gnu"
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: nfpm
      - name: Packages
        env:
          SNITCHHIKER_RELAY: target/release/snitchhiker-relay
        run: scripts/package.sh ${{ matrix.arch }} target/release/snitchhikerd out target/release/snitchhiker-ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 3
      # The relay again, static (musl), for its container image (FROM scratch).
      - name: Static relay
        env:
          SNITCHHIKER_VERSION_SUFFIX: ${{ inputs.version-suffix }}
          TARGET: ${{ matrix.arch }}-unknown-linux-musl
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add "$TARGET"
          export "CC_${TARGET//-/_}=musl-gcc"
          cargo build --locked --release --target "$TARGET" -p snitchhiker-relay
          mkdir -p relay
          cp "target/$TARGET/release/snitchhiker-relay" relay/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-static-${{ matrix.arch }}
          path: relay/snitchhiker-relay
          if-no-files-found: error
          retention-days: 3

  relay-image:
    name: Relay image (${{ matrix.arch }})
    needs: build
    strategy:
      matrix:
        include:
          - arch: x86_64
            platform: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relay-static-${{ matrix.arch }}
          path: relay
      # Built, then checked to run read-only with every capability dropped and report healthy, before it is pushed.
      - name: Build, check and push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/snitchhiker-relay
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x relay/snitchhiker-relay
          # Per architecture, under the version's tag (main for builds of main): replaced by the next build of it.
          if [[ $TAG == v* ]]; then base=${TAG#v}; else base=main; fi
          image="$IMAGE:$base-${{ matrix.platform }}"
          scripts/relay-image.sh relay/snitchhiker-relay "$image"
          docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "$GH_TOKEN"
          docker push --quiet "$image"

  relay-manifest:
    name: Relay image
    needs: relay-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      # One image for both architectures, under the release's tags (X.Y.Z, X.Y, latest), or main's (main, sha-<commit>).
      - name: Tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/snitchhiker-relay
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "$GH_TOKEN"
          if [[ $TAG == v* ]]; then
            base=${TAG#v}
            tags=("$base" "${base%.*}" latest)
          else
            base=main
            tags=(main "sha-${GITHUB_SHA::7}")
          fi
          for tag in "${tags[@]}"; do
            docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE:$base-amd64" "$IMAGE:$base-arm64"
          done

  android:
    name: Build (Android)
    if: >-
      github.repository_owner == 'nikarh'
      && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The app signing key.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: java gradle http:android-cmdline-tools cargo:cargo-ndk
      - run: mise run android:sdk
      # Both flavours, signed with the release key: `foss` (UnifiedPush, for F-Droid and direct installs) and `play`
      # (FCM, with the Firebase project in the FCM_* variables when there is one).
      - name: Build
        env:
          SNITCHHIKER_VERSION_SUFFIX: ${{ inputs.version-suffix }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          FCM_APP_ID: ${{ vars.FCM_APP_ID }}
          FCM_API_KEY: ${{ vars.FCM_API_KEY }}
          FCM_SENDER_ID: ${{ vars.FCM_SENDER_ID }}
        run: |
          set -euo pipefail
          keystore=$(mktemp)
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$keystore"
          export ANDROID_KEYSTORE=$keystore ANDROID_KEY_ALIAS=snitchhiker ANDROID_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          mise run android:build
          rm -f "$keystore"
          mkdir -p out
          cp android/app/build/outputs/apk/foss/release/app-foss-release.apk out/snitchhiker-android-foss.apk
          cp android/app/build/outputs/apk/play/release/app-play-release.apk out/snitchhiker-android-play.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-android
          path: out/*
          if-no-files-found: error
          retention-days: 3

  upload:
    name: Sign and upload
    needs: [build, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release
      - name: Import the signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Checksums and signature
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          gpg --batch --yes --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          cat SHA256SUMS
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release/* --clobber
          # Files a newer build no longer has (on `latest`, which is uploaded to again and again).
          gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            [[ -e release/$name ]] || gh release delete-asset "$TAG" "$name" --yes
          done

  repositories:
    # The signed package repositories (apt, pacman, dnf) on GitHub Pages, beside the docs: a release's packages, built
    # into each repository with its own distribution's tools, in that distribution's container. Releases only: the
    # repositories hold the newest release, not builds of main.
    name: Package repositories
    needs: upload
    if: startsWith(inputs.tag || github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      # Pushes to the gh-pages branch.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: packages
      - name: Repositories
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # The key, for each container's GnuPG: imported there, the passphrase given to every gpg the tools run.
          # shellcheck disable=SC2016 # expanded in the container
          gpg_setup='mkdir -m 700 -p ~/.gnupg
            printf "%s" "$GPG_PASSPHRASE" > ~/.gnupg/passphrase
            printf "pinentry-mode loopback\npassphrase-file %s\nbatch\n" ~/.gnupg/passphrase > ~/.gnupg/gpg.conf
            printf "%s" "$GPG_PRIVATE_KEY" | gpg --import 2>/dev/null
            export SNITCHHIKER_REPO_KEY=$(gpg --list-secret-keys --with-colons | awk -F: "/^fpr/ {print \$10; exit}")'
          run() {
            docker run --rm -v "$PWD:/w" -w /w -e GPG_PRIVATE_KEY -e GPG_PASSPHRASE "$1" bash -c "$2; $gpg_setup; $3"
          }
          run archlinux:latest 'pacman -Sy --noconfirm --needed gnupg >/dev/null' \
            'scripts/package-repos.sh arch packages repo'
          run debian:stable 'apt-get update -qq && apt-get install -y -qq apt-utils gnupg >/dev/null' \
            'scripts/package-repos.sh apt packages repo'
          run fedora:latest 'dnf install -y -q createrepo_c rpm-sign gnupg2 >/dev/null' \
            'scripts/package-repos.sh rpm packages repo'
          sudo chown -R "$(id -u)" repo
          cp docs/signing-key.asc repo/snitchhiker.asc
          printf '<!doctype html><meta charset="utf-8"><title>Snitchhiker packages</title><p>Package repositories of Snitchhiker: see <a href="../install/linux/">the install guide</a>.\n' > repo/index.html
      - run: scripts/docs-publish.sh repo repo
