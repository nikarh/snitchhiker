name: Publish

# Builds the binaries once per architecture, then signs and uploads them to the release. Runs when a release is
# published, and for the `latest` pre-release when the Latest workflow calls it. Run by hand, it publishes a release's
# tag again.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      version-suffix:
        description: Appended to the version from Cargo.toml, e.g. -dev+abc1234
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish, e.g. v0.2.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # Only releases are built when published: the Latest workflow creates the `latest` pre-release once and publishes
    # it itself.
    if: >-
      github.repository_owner == 'nikarh'
      && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu: the binaries need at least its glibc (2.35).
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # scripts/package.sh counts the commits of builds of main.
          fetch-depth: 0
      - name: Check the tag matches the version
        if: startsWith(env.TAG, 'v')
        run: test "$TAG" = "v$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
      # The eBPF programs are compiled with clang against the libbpf and kernel UAPI headers.
      - run: sudo apt-get install -y --no-install-recommends clang libbpf-dev linux-libc-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.arch }}
      - name: Build
        env:
          SNITCHHIKER_VERSION_SUFFIX: ${{ inputs.version-suffix }}
        run: |
          set -euo pipefail
          cargo build --locked --release
          bin=target/release/snitchhikerd
          "$bin" --version
          mkdir -p out
          cp "$bin" "out/snitchhikerd-${{ matrix.arch }}-linux-gnu"
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: nfpm
      - name: Packages
        run: scripts/package.sh ${{ matrix.arch }} target/release/snitchhikerd out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  upload:
    name: Sign and upload
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release
      - name: Import the signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Checksums and signature
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          gpg --batch --yes --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          cat SHA256SUMS
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release/* --clobber
          # Files a newer build no longer has (on `latest`, which is uploaded to again and again).
          gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            [[ -e release/$name ]] || gh release delete-asset "$TAG" "$name" --yes
          done
