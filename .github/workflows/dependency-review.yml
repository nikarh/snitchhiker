name: Dependency review

# Fails a pull request that adds a dependency with a known vulnerability.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    # GitHub offers dependency review on public repositories (or with Advanced Security): while this one is private,
    # the job is skipped, which the required check and auto-merge take as passing.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
