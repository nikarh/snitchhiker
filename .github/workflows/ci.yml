name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt, lint, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The protocol check compares the schema with main's (pull requests) or the previous commit's (pushes).
          fetch-depth: 0
      # The eBPF programs are compiled with clang against the libbpf and kernel UAPI headers; the desktop app links
      # fontconfig and freetype, and its toolkit wants the Wayland and xkbcommon headers.
      - run: >-
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang libbpf-dev linux-libc-dev
          libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
      # The toolchain (with clippy and rustfmt) comes from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install: false
      # rustfmt, clippy, the host-safe tests, the protocol's lint and compatibility, and every action pinned to a
      # commit and allowed (.github/allowed-actions.txt).
      - run: mise run ci
        env:
          PROTO_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || 'HEAD~1' }}

  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The app's Rust core, for the phone (arm64) and the emulator (x86_64).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      # The JDK, Gradle, the SDK's command-line tools and cargo-ndk.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: java gradle http:android-cmdline-tools cargo:cargo-ndk
      - run: mise run android:sdk
      # ktlint, Android Lint, the JVM tests and a debug build.
      - run: mise run android:check

  perf:
    # The performance budgets (plan §11.1): fails when deciding, ingestion or a query is over. On main, to save
    # runner minutes; `mise run perf` locally before changing the store or the engine.
    if: github.event_name != 'pull_request'
    name: performance budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang libbpf-dev linux-libc-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: perf
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install: false
      - run: mise run perf

  deny:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2

  e2e:
    # Arch on every change; Debian (another kernel, systemd and glibc) on main, to save runner minutes.
    name: e2e${{ matrix.distro != 'arch' && format(' ({0})', matrix.distro) || '' }}
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(github.event_name == 'push' && '["arch","debian","fedora"]' || '["arch"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SNITCHHIKER_VM_DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Let the runner's user use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage
      # The provisioned image as e2e/vm.sh makes it, with the key it lets in: once per version of vm.sh. Saved only when
      # there was none.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/snitchhiker-e2e/${{ matrix.distro }}-*.qcow2
            ~/.cache/snitchhiker-e2e/id_ed25519
            ~/.cache/snitchhiker-e2e/id_ed25519.pub
          key: snitchhiker-e2e-${{ matrix.distro }}-${{ hashFiles('e2e/vm.sh') }}
      # The VM boots while the toolchain is set up and the binaries build (e2e/run.sh then waits until it is ready).
      - run: e2e/vm.sh node start
      # The eBPF programs are compiled with clang against the libbpf and kernel UAPI headers; the desktop app (built
      # for the desktop scenarios) links fontconfig and freetype, and its toolkit wants the Wayland and xkbcommon headers.
      - run: >-
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang libbpf-dev linux-libc-dev
          libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: e2e
      # nfpm builds the package the VM installs.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: nfpm
      # The VM is kept for the desktop scenarios.
      - run: e2e/run.sh
        env:
          KEEP_VM: 1
      # The desktop app under a headless sway, driven by clicks (on Arch, on main).
      - if: github.event_name == 'push' && matrix.distro == 'arch'
        run: e2e/desktop.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-console-logs-${{ matrix.distro }}
          path: ~/.cache/snitchhiker-e2e/*/console.log
