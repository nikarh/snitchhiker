[package]
name = "snitchhiker-mobile"
description = "The Rust core of Snitchhiker's Android app: remote nodes over iroh, through JNI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
jni = "0.22.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snitchhiker-client = { version = "0.1.0", path = "../client", features = ["remote"] }
snitchhiker-proto = { version = "0.1.0", path = "../proto" }
snitchhiker-remote = { version = "0.1.0", path = "../remote" }
