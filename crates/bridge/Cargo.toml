[package]
name = "snitchhiker-bridge"
description = "Snitchhiker's remote access (snitchhiker-remote): a node's iroh endpoint beside its daemon, and the desktop app's way to remote nodes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "snitchhiker-remote"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
nix = { version = "0.32.0", features = ["signal", "process"] }
pico-args = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
snitchhiker-client = { version = "0.1.0", path = "../client", features = ["remote"] }
snitchhiker-proto = { version = "0.1.0", path = "../proto" }
snitchhiker-remote = { version = "0.1.0", path = "../remote" }
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
