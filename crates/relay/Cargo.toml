[package]
name = "snitchhiker-relay"
description = "Snitchhiker's relay: the iroh relay a user's nodes and devices meet through behind NAT"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
iroh-relay = { version = "1.4.1", default-features = false, features = ["server", "tls-ring"] }
pico-args = "0.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snitchhiker-proto = { version = "0.1.0", path = "../proto" }
snitchhiker-remote = { version = "0.1.0", path = "../remote" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
