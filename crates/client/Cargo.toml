[package]
name = "snitchhiker-client"
description = "A client of Snitchhiker nodes: the protocol's handshake, requests and subscriptions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The local cache of a node's history (SQLite), for apps.
cache = ["dep:rusqlite", "dep:snitchhiker-core"]

[dependencies]
nix = { version = "0.32.0", default-features = false, features = ["socket"] }
rusqlite = { version = "0.42.0", features = ["bundled"], optional = true }
snitchhiker-core = { version = "0.1.0", path = "../core", optional = true }
snitchhiker-proto = { version = "0.1.0", path = "../proto" }
thiserror = "2.0.21"
