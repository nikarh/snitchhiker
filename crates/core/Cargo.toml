[package]
name = "snitchhiker-core"
description = "Rule model, matching engine and query language of Snitchhiker, an interactive application firewall"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ipnet = "2.12.2"
psl = "2.1.255"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
allocation-counter = "0.8.1"
toml = "1.2.1"
