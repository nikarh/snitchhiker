[package]
name = "snitchhiker-ui"
description = "Snitchhiker's desktop app: prompts, rules and history of the nodes it is connected to"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures-lite = "2.6.1"
gpui = { version = "=0.3.12", package = "gpui-pre" }
gpui-component = "0.9.1"
gpui-kit-assets = "0.9.1"
gpui-pre-linux = { version = "=0.3.12", default-features = false, features = ["wayland", "x11"] }
gpui-pre-platform = "=0.3.12"
nix = { version = "0.32.0", default-features = false, features = ["fs", "socket", "user"] }
serde = { version = "1.0.229", features = ["derive"] }
snitchhiker-client = { version = "0.1.0", path = "../client" }
snitchhiker-core = { version = "0.1.0", path = "../core" }
snitchhiker-proto = { version = "0.1.0", path = "../proto" }
toml = "1.2.1"
zbus = "6.3.0"
