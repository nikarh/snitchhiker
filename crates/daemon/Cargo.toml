[package]
name = "snitchhiker-daemon"
description = "Snitchhiker's root daemon (snitchhikerd) and command line (snitchhiker), in one binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "snitchhikerd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
nix = { version = "0.32.0", features = ["socket", "poll", "user"] }
pico-args = "0.5.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
