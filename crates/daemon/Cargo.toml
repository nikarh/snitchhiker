[package]
name = "snitchhiker-daemon"
description = "Snitchhiker's root daemon (snitchhikerd) and command line (snitchhiker), in one binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "snitchhikerd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
arc-swap = "1.9.5"
nix = { version = "0.32.0", features = ["socket", "poll", "user", "signal"] }
pico-args = "0.5.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.154"
snitchhiker-core = { version = "0.1.0", path = "../core" }
snitchhiker-ebpf = { version = "0.1.0", path = "../ebpf" }
snitchhiker-netfilter = { version = "0.1.0", path = "../netfilter" }
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
