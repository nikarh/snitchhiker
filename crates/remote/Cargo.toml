[package]
name = "snitchhiker-remote"
description = "Snitchhiker's remote transport: the protocol over iroh (QUIC between Ed25519 keys), for nodes and clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "0.6.1"
ring = "0.17.14"
sha2 = "0.11.1"
spake2 = { version = "0.5.0-pre.0", features = ["getrandom"] }
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
