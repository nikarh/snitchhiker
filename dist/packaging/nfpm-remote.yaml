# nfpm config of the remote access packages (snitchhiker-remote), built by scripts/package.sh from a release binary.
# Installed only where it is wanted: on a node that paired devices reach, and beside the desktop app to reach other
# nodes (decision 0016).
name: snitchhiker-remote
arch: ${SNITCHHIKER_ARCH}
version: ${SNITCHHIKER_VERSION}
version_schema: none
release: 1
section: net
priority: optional
maintainer: Nikolay Arhipov <nikarh@users.noreply.github.com>
description: Remote access of the Snitchhiker application firewall, for paired phones and desktops
homepage: https://github.com/nikarh/snitchhiker
license: MIT OR Apache-2.0

overrides:
  deb:
    depends:
      - snitchhiker (= ${SNITCHHIKER_VERSION}-1)
      - libc6 (>= 2.35)
    scripts:
      postinstall: dist/packaging/deb/remote-postinst
      preremove: dist/packaging/deb/remote-prerm
  archlinux:
    depends:
      - snitchhiker=${SNITCHHIKER_VERSION}
      - glibc
  rpm:
    depends:
      - snitchhiker = ${SNITCHHIKER_VERSION}
      - glibc >= 2.35
    scripts:
      postinstall: dist/packaging/rpm/remote-post.sh
      preremove: dist/packaging/rpm/remote-preun.sh

archlinux:
  packager: Nikolay Arhipov <nikarh@users.noreply.github.com>

contents:
  - src: target/package/snitchhiker-remote
    dst: /usr/bin/snitchhiker-remote
    file_info:
      mode: 0755
  - src: dist/remote/snitchhiker-remote.service
    dst: /usr/lib/systemd/system/snitchhiker-remote.service
    file_info:
      mode: 0644
  - src: dist/remote/snitchhiker-remote.sysusers
    dst: /usr/lib/sysusers.d/snitchhiker-remote.conf
    file_info:
      mode: 0644
  - src: dist/remote/remote.toml
    dst: /etc/snitchhiker/remote.toml
    type: config|noreplace
    file_info:
      mode: 0644
  - src: LICENSE-MIT
    dst: /usr/share/licenses/snitchhiker-remote/LICENSE-MIT
  - src: LICENSE-APACHE
    dst: /usr/share/licenses/snitchhiker-remote/LICENSE-APACHE
