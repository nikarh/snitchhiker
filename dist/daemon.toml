# Snitchhiker daemon settings. Only root edits this file; after a change: systemctl restart snitchhikerd. Clients can
# change the policy settings (mode, no_match, no_client, prompt_timeout_secs, on_timeout, retention_days) while the
# daemon runs, over this file's values (`snitchhiker policy`); loosening them needs step-up.

# enforce: rules and no_match decide. monitor: everything passes, and what would have happened is recorded
# (`snitchhiker events`), to learn what a machine does before enforcing. Packages start in monitor mode.
mode = "monitor"

# What happens to a connection no rule decides: allow, deny (dropped; the program times out), reject (dropped,
# and the program's socket closed at once) or ask (held while the connected clients are asked).
no_match = "deny"

# With no_match = "ask": what happens when no client listens for prompts, how long a prompt waits for an answer
# (1 to 3600 seconds), and what happens when nobody answers in time. Each of allow, deny or reject.
#no_client = "deny"
#prompt_timeout_secs = 30
#on_timeout = "deny"

# While the daemon isn't running: closed (nothing new gets out; the table stays when it stops) or open (everything
# passes; the table is removed when it stops). On servers reached over the network, open is the safer choice.
fail = "closed"

# NFQUEUE queues, one deciding thread each, starting at queue number `queue`.
#queues = 4
#queue = 0

# Learn the names of addresses from the DNS answers processes receive, so rules can name hosts.
#learn_dns = true

# Bridges whose forwarded traffic is decided too: containers on bridge networks, VMs on taps. Names, or prefixes ending
# in `*`. Empty: forwarded traffic is left alone (a router's, for one).
#forward_from = ["docker0", "br-*", "podman*", "cni-*", "virbr*", "lxdbr*", "incusbr*"]

# Client binaries allowed on the client socket by path alone. Packages register their client with
# `snitchhikerd trust-client <path>` instead, which also pins it to its SHA-256.
#trusted_clients = []

# What confirms a dangerous action a client asks for (a rule that allows broadly, naming no particular program or
# destination; a looser policy; pairing a device): polkit (the user's password, usually) or off. Either way it is audited (`snitchhiker audit`).
#step_up = "polkit"

# The local users who administer the node through the desktop app: members of these groups (those who may become root,
# usually). Other users' apps can see the node and its history, and change nothing.
#admin_groups = ["wheel", "sudo", "admin"]

# The built-in System folder: loopback allowed, as OpenSnitch does by default. Its rules are in the fallback tier, so
# any other matching rule decides instead.
#default_rules = true

# Rule files root keeps (*.toml, the format of `snitchhiker rules export`): read at start and on reload, shown to
# clients but locked. For a fleet's baseline from provisioning.
#rules_dir = "/etc/snitchhiker/rules.d"

#database = "/var/lib/snitchhiker/state.db"
#retention_days = 30

# Where alerts are sent as JSON (an HTTP POST), and a file with the secret that signs each delivery
# (X-Snitchhiker-Signature: sha256=<HMAC-SHA256 of the body>).
#alert_webhook = "https://hooks.example.org/snitchhiker"
#alert_webhook_secret_file = "/etc/snitchhiker/webhook-secret"

# The group the client binaries are setgid to, and the client socket belongs to (made by the package).
#client_group = "snitchhiker-ui"

# Programs that may propose rules on the agent socket (patterns as rules write them). Empty: any program, its
# proposals marked as not from a known agent.
#agent_programs = []

# Accept paired devices over the network: phones, the desktop app on other machines. The relays (your own
# snitchhiker-relay) the node keeps a connection to, so devices reach it behind NAT; the UDP port of the remote
# endpoint (0: any free port); and whether the node announces itself on the local network (mDNS).
#remote = false
#relays = ["https://relay.example.org/"]
#remote_port = 0
#lan_discovery = true

# Who is notified of a prompt: every client (all), or the clients on this machine first and the remote devices when
# none listens, the sessions are locked or idle, or after escalate_after_secs (escalate).
#prompt_routing = "all"
#escalate_after_secs = 20

# The push gateway's endpoint id (a snitchhiker-relay with [push], reached through relays): it wakes the devices for
# prompts, and tells them when the node has been gone for offline_after_secs.
#push_gateway = ""
#offline_after_secs = 120

# The largest blocklist fetched, in bytes.
#blocklist_max_bytes = 67108864
